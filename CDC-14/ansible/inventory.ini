# CDC-14 - Inventaire. Aucun mot de passe ici : il est demande a l'execution (--ask-pass).
[acces]
ACC-SW1 ansible_host=10.10.99.3

[distribution]
DIST-SW1 ansible_host=10.10.99.2

[switches:children]
acces
distribution

[switches:vars]
ansible_connection=network_cli
ansible_network_os=ios
ansible_user=ansible
# IOS 12.4 est ancien : le client SSH doit accepter ses algorithmes
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group1-sha1 -o Ciphers=+aes128-cbc -o HostKeyAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no'
