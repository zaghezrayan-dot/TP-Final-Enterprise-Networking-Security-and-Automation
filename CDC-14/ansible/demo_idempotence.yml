---
# CDC-14 - Demonstration d'idempotence executee sur la VM NMS-01 (sans commutateur).
# Meme fichier de donnees (vlans.yml) que le playbook de deploiement ; la cible est un fichier local.
- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vlans.yml
  tasks:
    - name: Appliquer les VLAN dans un fichier de configuration
      lineinfile:
        path: /tmp/vlans_deployes.cfg
        create: yes
        line: "vlan {{ item.id }} name {{ item.name }}"
      loop: "{{ vlans }}"
